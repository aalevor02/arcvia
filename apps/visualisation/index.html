<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      ── Why nothing here names a project ──────────────────────────────────────
      This app serves any published project, chosen by slug at run time. Every
      value that used to sit here was one client's — the title, the description,
      the share card, and a `noscript` block carrying a developer's phone number.

      With one client that was correct. With many it is a leak: a visitor opening
      client B's link would have seen client A's name in the tab, and shared a
      card advertising A's development.

      `main.ts` sets the title, description and Open Graph tags from whichever
      project actually loads. The defaults below are deliberately neutral, so the
      wrong answer is never the one on screen.

      A crawler does not run JavaScript, so link previews on WhatsApp and Slack
      read THIS file and never see what `main.ts` sets. That is handled a layer
      up: `services/api/src/routes/share.js` serves `/p/<slug>/` and injects the
      title, description and Open Graph tags from the publication the slug names
      before the HTML leaves the server.

      So these defaults are what a crawler sees only when the slug names nothing
      published — which is why they must stay neutral. Anything named here is
      served for every project that 404s.
    -->
    <title>Project walkthrough</title>
    <meta name="description" content="An interactive presentation of a residential project." />
    <meta name="theme-color" content="#16211c" />

    <meta property="og:title" content="Project walkthrough" />
    <meta
      property="og:description"
      content="An interactive presentation of a residential project."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="padding: 40px; font-family: system-ui, sans-serif">
        <h1>This presentation needs JavaScript</h1>
        <p>
          Please enable JavaScript, or contact the developer directly for details
          of this project.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
